# важно, чтобы black, flake8 и mypy уже были установлены в venv
repos:
-   repo: local
    hooks:
    -   id: black
        name: Formatting with black
        entry: black --check
        language: system
        types: [python]
        stages: [pre-push]

    -   id: flake8
        name: Linting with flake8
        entry: flake8
        language: system
        types: [python]
        stages: [pre-push]

    -   id: mypy
        name: Type checking with mypy
        entry: mypy --ignore-missing-imports
        language: system
        types: [python]
        require_serial: true
        stages: [pre-push]

    -   id: pytest
        name: Testing with pytest
        entry: pytest -v --color=yes -c pytest.ini
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

