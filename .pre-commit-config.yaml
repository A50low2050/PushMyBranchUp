# важно, чтобы black, flake8 и mypy уже были установлены в venv
repos:
-   repo: local
    hooks:
    -   id: black
        name: black
        entry: black
        language: system
        types: [python]

    -   id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]

    -   id: mypy
        name: mypy
        entry: mypy --ignore-missing-imports
        language: system
        types: [python]
        require_serial: true
