[flake8]
max-line-length = 88
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .mypy_cache,
    logs

[mypy]
files = src
strict = True
ignore_missing_imports = True
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = False
disallow_any_generics = False
plugins = pydantic.mypy
