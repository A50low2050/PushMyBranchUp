name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare environment file
        run: |
          cp .env.example .env

      - name: Run Black (format check)
        run: |
          black --check src

      - name: Run Flake8 (linter)
        run: |
          flake8 src

      - name: Run Mypy (type check)
        run: |
          mypy src

      - name: Run Pytest
        run: |
          pytest

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Base Docker environment file
        run: cp .env.docker.example .env.docker

      - name: Append SMTP to Docker environment file
        if: ${{ secrets.SMTP_HOST != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        run: |
          echo "ENV_NOTIFICATIONS__ENABLED=True" >> .env.docker
          echo "ENV_NOTIFICATIONS__EMAIL__HOST=$SMTP_HOST" >> .env.docker
          echo "ENV_NOTIFICATIONS__EMAIL__PORT=$SMTP_PORT" >> .env.docker
          echo "ENV_NOTIFICATIONS__EMAIL__USER=$SMTP_USER" >> .env.docker
          echo "ENV_NOTIFICATIONS__EMAIL__PASSWORD=$SMTP_PASSWORD" >> .env.docker
          echo "ENV_NOTIFICATIONS__EMAIL__FROM_EMAIL=$SMTP_FROM_EMAIL" >> .env.docker

      - name: Build Docker image
        run: |
          docker compose build

      - name: Run Docker container
        run:  |
          timeout 60s docker compose up --abort-on-container-exit || true

      - name: Stop Docker containers
        if: always()
        run: |
          docker compose down
